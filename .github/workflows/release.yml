name: Release

# Publica os instaladores dos três SOs a cada push em main — mas só depois
# do CI daquele commit passar. `workflow_run` é o que permite esse
# encadeamento: o gatilho é a CONCLUSÃO do CI, não o push em si, então um
# commit que quebrou teste nunca vira instalador publicado.
#
# `workflow_dispatch` fica para republicar um commit já validado sem
# precisar de um push novo. O SHA é obrigatório para impedir que o dispatch
# publique o topo de `main` sem CI correspondente.
on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'SHA exato de um commit que passou no workflow CI'
        required: true
        type: string

permissions:
  contents: write
  actions: read

# Um release por vez. Se dois pushes entrarem em sequência, o mais novo
# cancela o anterior — publicar o penúltimo commit não tem valor quando o
# último já está a caminho.
concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release
    # A release/tag is created once before the OS matrix starts. electron-builder
    # can then only upload assets, so parallel jobs never race to create it.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}

      - name: Verify CI passed for this exact commit
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
        run: |
          passed="$(gh run list --workflow CI --commit "$TARGET_SHA" --limit 20 \
            --json status,conclusion \
            --jq 'any(.[]; .status == "completed" and .conclusion == "success")')"
          if [[ "$passed" != "true" ]]; then
            echo "Nenhuma execução CI verde encontrada para $TARGET_SHA." >&2
            exit 1
          fi

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./app/package.json').version.split('.').slice(0, 2).join('.')")"
          RELEASE_TAG="v${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create prerelease container
        shell: bash
        # A API do GitHub falha de vez em quando com um HTTP 500 transitório
        # que passa sozinho na tentativa seguinte — medido em 25 e 26/08/2026:
        # duas releases ficaram paradas por horas nesse erro, até alguém
        # notar e mandar rodar de novo à mão. `retry.sh` (com teste próprio em
        # `retry.test.sh`) automatiza exatamente esse "rodar de novo".
        run: |
          source "$GITHUB_WORKSPACE/.github/scripts/retry.sh"

          TAG="${{ steps.release.outputs.release_tag }}"
          TARGET="${{ github.event.workflow_run.head_sha || inputs.commit_sha }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; mantendo os artefatos publicados."
          else
            retry 5 5 -- gh release create "$TAG" \
              --target "$TARGET" \
              --title "$TAG" \
              --prerelease \
              --notes "Build em publicação; será promovida após os instaladores de Linux, Windows e macOS passarem."
          fi

  publish:
    name: Publish ${{ matrix.os }}
    # No caminho do workflow_dispatch não existe `workflow_run`, e a
    # conclusão vem vazia — por isso o segundo lado do OR, que deixa a
    # execução manual passar.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success' }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: app

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run roda no contexto do branch padrão, não no commit que
          # disparou o CI. Sem fixar o SHA, o release publicaria o topo de
          # main em vez do commit que realmente foi validado.
          ref: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Reaproveita o diagnóstico incremental salvo pelo CI do mesmo SO. O
      # tsc ainda confere as entradas; cache antigo apenas força reconstrução.
      - name: Restore TypeScript incremental cache
        uses: actions/cache@v4
        with:
          path: app/node_modules/.tmp
          key: typecheck-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/tsconfig*.json') }}
          restore-keys: |
            typecheck-${{ runner.os }}-

      - name: Set release version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          npm version --no-git-tag-version "$VERSION"
          echo "FELIXO_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FELIXO_RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Build renderer
        run: npm run build

      - name: Build installers
        shell: bash
        run: npx electron-builder --publish never

      - name: Install Linux virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Validate installed release artifact
        shell: bash
        run: |
          smoke=(node scripts/release-smoke.cjs --release-dir release --report "release/release-smoke-${RUNNER_OS}.json")
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a --server-args="-screen 0 1280x720x24" "${smoke[@]}"
          else
            "${smoke[@]}"
          fi

      - name: Upload installers
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release -maxdepth 1 -type f -print0)

          if (( ${#files[@]} == 0 )); then
            echo "Nenhum instalador foi gerado em app/release." >&2
            exit 1
          fi

          gh release upload "$FELIXO_RELEASE_TAG" "${files[@]}" --clobber

  # A release nasce como PRÉ-lançamento e só vira definitiva aqui, depois que os
  # três jobs passaram.
  #
  # Enquanto publicava direto, cada job alimentava uma release já pública e os
  # três terminam em momentos diferentes — na v0.1.14 o AppImage subiu 15:01:01
  # e o `latest-linux.yml` só 15:02:06, com o `latest.yml` do Windows às
  # 15:03:58. Nessas janelas a release já era a "latest" sem o manifesto da
  # plataforma, então quem checasse ali tomava 404 e via "Falha ao atualizar".
  #
  # Pré-lançamento, e não rascunho: `/releases/latest` do GitHub ignora os dois,
  # mas rascunho **não cria tag no git** — está dito no próprio
  # `electron-publish/out/gitHubPublisher.js`. Sem tag, o GitHub aceita várias
  # releases com o mesmo `tag_name`, os três jobs paralelos deixam de colidir e
  # nenhum recebe o `422 already_exists` que os faz convergir na mesma release.
  # Foi o que aconteceu na v0.1.15: três rascunhos, com Linux, macOS e Windows
  # separados, e a publicação de um deles sozinho. Pré-lançamento cria a tag e
  # devolve o 422, que é justamente o mecanismo que junta os três.
  finalize:
    name: Publish release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}

      # Mesma conta do job de publicação (`major.minor` do package.json +
      # número da execução), porque a tag precisa bater com a que o
      # electron-builder criou.
      - name: Resolve release tag
        shell: bash
        working-directory: app
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          echo "RELEASE_TAG=v${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Os artefatos de macOS não são assinados nem notarizados, então o
      # Gatekeeper bloqueia a primeira abertura — às vezes com uma mensagem que
      # sugere procurar um app na App Store, sem deixar claro que é bloqueio de
      # segurança. Quem baixa o .dmg lê a página da release, não o repositório,
      # então a instrução precisa estar aqui.
      #
      # Fica aqui, e não no job de matriz, por dois motivos: é uma edição de
      # metadados da release, igual à publicação logo abaixo, e no job de
      # matriz precisava de um `if: matrix.os == 'ubuntu-latest'` só para o
      # aviso não ser anexado três vezes.
      - name: Add macOS Gatekeeper notice to the release
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          NOTICE_MARKER="<!-- macos-gatekeeper-notice -->"
          CURRENT_BODY="$(gh release view "$TAG" --json body --jq .body)"

          # Idempotente: uma re-execução do workflow não deve empilhar avisos.
          if [[ "$CURRENT_BODY" == *"$NOTICE_MARKER"* ]]; then
            echo "Aviso já presente na release $TAG."
            exit 0
          fi

          {
            printf '%s\n' "$CURRENT_BODY"
            printf '\n%s\n' "$NOTICE_MARKER"
            printf '\n---\n\n'
            printf '### ⚠️ macOS: a primeira abertura é bloqueada\n\n'
            printf 'Esta build **não é assinada nem notarizada** pela Apple. O macOS bloqueia a primeira execução e pode exibir uma mensagem confusa — inclusive uma janela pedindo para **escolher um aplicativo na App Store**. O Felixo não é distribuído pela App Store; é apenas o bloqueio de segurança.\n\n'
            printf 'Para abrir, depois de arrastar o app para **Aplicativos**:\n\n'
            printf '1. **Ajustes do Sistema > Privacidade e Segurança**, role até o final e clique em **Abrir Assim Mesmo**; ou\n'
            printf '2. rode no Terminal:\n\n'
            printf '   ```bash\n   xattr -dr com.apple.quarantine "/Applications/Felixo AI Core.app"\n   ```\n\n'
            printf 'Se o macOS disser que o app está **"danificado"**, é o mesmo bloqueio — use o comando acima. Passo a passo completo no [Guia do Usuário](https://github.com/Felipe-Alcantara/Felixo-AI-Core/blob/main/docs/guias/GUIA-USUARIO.md#macos).\n\n'
            printf 'Faça isso apenas com arquivos baixados desta página oficial de Releases.\n'
          } > release-notes-body.md

          gh release edit "$TAG" --notes-file release-notes-body.md

      - name: Publish the draft release
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG nao encontrada." >&2
            exit 1
          fi

          # Guarda contra o defeito que a v0.1.15 expos: se por qualquer motivo
          # existir mais de uma release com esta tag, publicar uma delas
          # entregaria uma release parcial como "latest". Melhor falhar e deixar
          # tudo invisivel do que publicar pela metade.
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")] | length")"
          if [[ "$COUNT" != "1" ]]; then
            echo "Esperava 1 release com a tag $RELEASE_TAG, encontrei $COUNT." >&2
            exit 1
          fi

          # Idempotente: reexecutar o workflow com a release ja definitiva nao e erro.
          if [[ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" == "false" ]]; then
            echo "Release $RELEASE_TAG ja esta publicada."
            exit 0
          fi

          # Não force "--latest" sem checar quem já é a mais nova. Medido em
          # 26/08/2026: quando um release de commit mais antigo termina de
          # publicar DEPOIS de um mais novo (reexecução tardia, ordem de
          # matriz diferente entre execuções concorrentes), "--latest" sem
          # essa checagem reverte quem está atualizado — a v0.1.80 marcou por
          # cima a v0.1.81 só por ter rodado por último.
          source "$GITHUB_WORKSPACE/.github/scripts/release-version.sh"

          CURRENT_LATEST_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"

          if [[ -z "$CURRENT_LATEST_TAG" ]] || is_tag_newer "$RELEASE_TAG" "$CURRENT_LATEST_TAG"; then
            gh release edit "$RELEASE_TAG" --prerelease=false --latest
            echo "Release $RELEASE_TAG publicada e marcada como mais recente."
          else
            gh release edit "$RELEASE_TAG" --prerelease=false
            echo "Release $RELEASE_TAG publicada, mas $CURRENT_LATEST_TAG continua sendo a mais recente (é posterior a esta)."
          fi
