name: Release

# Publica os instaladores dos três SOs a cada push em main — mas só depois
# do CI daquele commit passar. `workflow_run` é o que permite esse
# encadeamento: o gatilho é a CONCLUSÃO do CI, não o push em si, então um
# commit que quebrou teste nunca vira instalador publicado.
#
# `workflow_dispatch` fica para republicar um commit manualmente sem
# precisar de um push novo.
on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

# Um release por vez. Se dois pushes entrarem em sequência, o mais novo
# cancela o anterior — publicar o penúltimo commit não tem valor quando o
# último já está a caminho.
concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.os }}
    # No caminho do workflow_dispatch não existe `workflow_run`, e a
    # conclusão vem vazia — por isso o segundo lado do OR, que deixa a
    # execução manual passar.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: app

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run roda no contexto do branch padrão, não no commit que
          # disparou o CI. Sem fixar o SHA, o release publicaria o topo de
          # main em vez do commit que realmente foi validado.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          npm version --no-git-tag-version "$VERSION"
          echo "FELIXO_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build renderer
        run: npm run build

      - name: Publish installers
        run: npx electron-builder --publish always

  # A release nasce como PRÉ-lançamento e só vira definitiva aqui, depois que os
  # três jobs passaram.
  #
  # Enquanto publicava direto, cada job alimentava uma release já pública e os
  # três terminam em momentos diferentes — na v0.1.14 o AppImage subiu 15:01:01
  # e o `latest-linux.yml` só 15:02:06, com o `latest.yml` do Windows às
  # 15:03:58. Nessas janelas a release já era a "latest" sem o manifesto da
  # plataforma, então quem checasse ali tomava 404 e via "Falha ao atualizar".
  #
  # Pré-lançamento, e não rascunho: `/releases/latest` do GitHub ignora os dois,
  # mas rascunho **não cria tag no git** — está dito no próprio
  # `electron-publish/out/gitHubPublisher.js`. Sem tag, o GitHub aceita várias
  # releases com o mesmo `tag_name`, os três jobs paralelos deixam de colidir e
  # nenhum recebe o `422 already_exists` que os faz convergir na mesma release.
  # Foi o que aconteceu na v0.1.15: três rascunhos, com Linux, macOS e Windows
  # separados, e a publicação de um deles sozinho. Pré-lançamento cria a tag e
  # devolve o 422, que é justamente o mecanismo que junta os três.
  finalize:
    name: Publish release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Mesma conta do job de publicação (`major.minor` do package.json +
      # número da execução), porque a tag precisa bater com a que o
      # electron-builder criou.
      - name: Resolve release tag
        shell: bash
        working-directory: app
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          echo "RELEASE_TAG=v${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Os artefatos de macOS não são assinados nem notarizados, então o
      # Gatekeeper bloqueia a primeira abertura — às vezes com uma mensagem que
      # sugere procurar um app na App Store, sem deixar claro que é bloqueio de
      # segurança. Quem baixa o .dmg lê a página da release, não o repositório,
      # então a instrução precisa estar aqui.
      #
      # Fica aqui, e não no job de matriz, por dois motivos: é uma edição de
      # metadados da release, igual à publicação logo abaixo, e no job de
      # matriz precisava de um `if: matrix.os == 'ubuntu-latest'` só para o
      # aviso não ser anexado três vezes.
      - name: Add macOS Gatekeeper notice to the release
        shell: bash
        run: |
          TAG="$RELEASE_TAG"
          NOTICE_MARKER="<!-- macos-gatekeeper-notice -->"
          CURRENT_BODY="$(gh release view "$TAG" --json body --jq .body)"

          # Idempotente: uma re-execução do workflow não deve empilhar avisos.
          if [[ "$CURRENT_BODY" == *"$NOTICE_MARKER"* ]]; then
            echo "Aviso já presente na release $TAG."
            exit 0
          fi

          {
            printf '%s\n' "$CURRENT_BODY"
            printf '\n%s\n' "$NOTICE_MARKER"
            printf '\n---\n\n'
            printf '### ⚠️ macOS: a primeira abertura é bloqueada\n\n'
            printf 'Esta build **não é assinada nem notarizada** pela Apple. O macOS bloqueia a primeira execução e pode exibir uma mensagem confusa — inclusive uma janela pedindo para **escolher um aplicativo na App Store**. O Felixo não é distribuído pela App Store; é apenas o bloqueio de segurança.\n\n'
            printf 'Para abrir, depois de arrastar o app para **Aplicativos**:\n\n'
            printf '1. **Ajustes do Sistema > Privacidade e Segurança**, role até o final e clique em **Abrir Assim Mesmo**; ou\n'
            printf '2. rode no Terminal:\n\n'
            printf '   ```bash\n   xattr -dr com.apple.quarantine "/Applications/Felixo AI Core.app"\n   ```\n\n'
            printf 'Se o macOS disser que o app está **"danificado"**, é o mesmo bloqueio — use o comando acima. Passo a passo completo no [Guia do Usuário](https://github.com/Felipe-Alcantara/Felixo-AI-Core/blob/main/docs/guias/GUIA-USUARIO.md#macos).\n\n'
            printf 'Faça isso apenas com arquivos baixados desta página oficial de Releases.\n'
          } > release-notes-body.md

          gh release edit "$TAG" --notes-file release-notes-body.md

      - name: Publish the draft release
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG nao encontrada." >&2
            exit 1
          fi

          # Guarda contra o defeito que a v0.1.15 expos: se por qualquer motivo
          # existir mais de uma release com esta tag, publicar uma delas
          # entregaria uma release parcial como "latest". Melhor falhar e deixar
          # tudo invisivel do que publicar pela metade.
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")] | length")"
          if [[ "$COUNT" != "1" ]]; then
            echo "Esperava 1 release com a tag $RELEASE_TAG, encontrei $COUNT." >&2
            exit 1
          fi

          # Idempotente: reexecutar o workflow com a release ja definitiva nao e erro.
          if [[ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" == "false" ]]; then
            echo "Release $RELEASE_TAG ja esta publicada."
            exit 0
          fi

          gh release edit "$RELEASE_TAG" --prerelease=false --latest
          echo "Release $RELEASE_TAG publicada."
