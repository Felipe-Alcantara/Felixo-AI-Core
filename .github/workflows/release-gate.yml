name: Release gate

# Decide, depois do CI de um commit em `main` passar, se ele merece um
# instalador novo — e só então dispara o workflow `Release` (por
# `workflow_dispatch`). Só publica o commit que muda algo que entra no
# instalador ou que o Release executa como gate (lista de inclusão em
# `.github/scripts/release-relevant.sh`); docs, testes, launcher e CI não
# publicam nada (~11 min e uma versão sem mudança de app a menos).
#
# Isto NÃO pode ser um filtro dentro do `release.yml`: o `concurrency` dele
# cancela o Release em andamento quando outra run entra, e um commit só de docs
# cancelaria a publicação de um commit de app anterior. Aqui, um commit
# irrelevante nem chega a entrar no grupo de concorrência do Release.
on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  gate:
    name: Decide release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Decide whether the app changed
        id: decide
        shell: bash
        run: |
          source .github/scripts/release-relevant.sh
          source .github/scripts/release-base.sh
          # Qualquer falha ao ler o diff cai em `true`: na dúvida, publica.
          # Preserve UTF-8 path names: core.quotePath's default C escapes stop
          # the selector from recognizing ignored non-ASCII local-copy paths.
          AVALIADOS="$(gh run list --workflow release-gate.yml --branch main --status completed --limit 1000 --json headSha,conclusion --jq '.[] | select(.conclusion == "success") | .headSha' 2>/dev/null || true)"
          BASE="$(printf '%s\n' "$AVALIADOS" | release_base "$TARGET_SHA")"
          if [[ -n "$BASE" ]]; then
            FILES="$(git -c core.quotePath=false diff --name-only "$BASE" "$TARGET_SHA" 2>/dev/null || true)"
            echo "Commit de base avaliado: $BASE"
          else
            FILES=""
            echo "Nenhum commit de base confiável; decisão conservadora: publicar."
          fi
          RELEVANT="$(printf '%s\n' "$FILES" | release_relevant)"
          echo "Arquivos alterados neste commit:"
          printf '%s\n' "$FILES"
          echo "Release relevante: $RELEVANT"
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"

      - name: Dispatch Release
        if: steps.decide.outputs.relevant == 'true'
        shell: bash
        run: |
          gh workflow run release.yml --ref main -f commit_sha="$TARGET_SHA"
          echo "Release disparado para $TARGET_SHA."

      - name: Skip Release
        if: steps.decide.outputs.relevant != 'true'
        shell: bash
        run: |
          echo "Commit $TARGET_SHA não muda nada que entra no instalador nem os gates do Release; nenhum instalador novo é publicado."
