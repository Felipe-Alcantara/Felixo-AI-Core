name: Nightly

# Cobertura diária que não precisa (ou deixou de) rodar em cada PR.
#
# 1. Comparação completa de gerenciadores nos quatro SOs. É uma pergunta
#    arquitetural que não muda de um PR para o outro, mas depende do SO —
#    então roda aqui, todo dia, com os mesmos flags e gates (`--check`). Desde
#    19/10/2026 nenhum benchmark de gerenciador roda no CI nem no Release.
# 2. Audits de dependência (npm completo, npm --omit=dev e pip-audit). Um
#    advisory novo é publicado sem nenhum commit nosso; sem uma execução
#    agendada, ele só apareceria no próximo PR. Os passos são cópias dos jobs
#    `Dependency policy` e `Python dependency audit` do ci.yml.
# 3. Matriz visual completa do canvas. O CI de cada PR roda a matriz enxuta
#    (16 casos: tema × 7 viewports, mais o Modo Performance nas duas pontas);
#    aqui roda a completa (44 casos: tema × 11 viewports × Modo Performance
#    ligado e desligado), só a sessão A do smoke, nos três SOs.
# 4. Benchmarks e a matriz de 50 repetições do contexto inicial (job `medicoes`).
# 5. O smoke completo do canvas no Windows e no macOS (job `canvas-smoke`).
#
# Nada aqui é check obrigatório de PR nem dispara Release.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-managers:
    name: Gerenciadores de pacote (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Compara o npm-runtime com pnpm/Yarn e mede Corepack como ponte de
      # bootstrap. Alternativas indisponíveis no runner não bloqueiam a
      # matriz, mas qualquer alternativa encontrada que falhe no smoke deixa o
      # job vermelho. O JSON registra a disponibilidade por sistema.
      - name: Benchmark package-manager alternatives
        timeout-minutes: 10
        shell: bash
        run: npm run benchmark:package-managers -- --iterations=2 --check --out=package-manager-alternatives-${{ matrix.os }}.json

      - name: Upload package-manager alternatives benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-manager-alternatives-${{ matrix.os }}
          path: app/package-manager-alternatives-${{ matrix.os }}.json
          if-no-files-found: ignore

      - name: Benchmark package-manager operational cost
        timeout-minutes: 15
        shell: bash
        run: npm run benchmark:package-managers:performance:check -- --iterations=2 --agents=1,2,5,10 --out=package-manager-operational-${{ matrix.os }}.json

      - name: Upload package-manager operational benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-manager-operational-${{ matrix.os }}
          path: app/package-manager-operational-${{ matrix.os }}.json
          if-no-files-found: ignore

  # Mesmos passos de audit/SBOM/inventário/gate do job `Dependency policy` do
  # ci.yml, sem as duas bancadas (o job acima já as cobre). O empacotamento
  # continua porque o gate `verify-dependency-policy.cjs` exige o inventário
  # do app empacotado — é ele que decide, com as mesmas regras do PR, se um
  # advisory novo bloqueia.
  # Nomes com "(nightly)": um check com o MESMO nome de um obrigatório da main
  # ("Dependency policy") poderia, num workflow_dispatch numa branch de PR,
  # aparecer como aquele check no commit do PR.
  dependency-policy:
    name: Dependency policy (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare policy reports
        shell: bash
        run: mkdir -p build/dependency-policy

      # O relatório completo inclui devDependencies porque Electron, npm e
      # parte da árvore que chega ao instalador vivem nesse grupo. O status do
      # comando é guardado: advisories ficam visíveis sem impedir a coleta dos
      # outros relatórios; o gate abaixo bloqueia críticos.
      - name: Audit npm dependency graph (complete)
        shell: bash
        run: |
          # Até 3 tentativas SÓ quando o npm não devolveu relatório (registro fora
          # do ar: 400/503 em 19/09). Com relatório, vale a primeira resposta — o
          # gate não é afrouxado, só deixa de cair por um soluço do registro.
          for attempt in 1 2 3; do
            set +e
            npm audit --json > build/dependency-policy/npm-audit-full.json
            status=$?
            set -e
            if grep -q '"auditReportVersion"' build/dependency-policy/npm-audit-full.json; then break; fi
            echo "npm audit sem relatório (tentativa $attempt/3); o registro do npm pode estar indisponível."
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          printf '%s\n' "$status" > build/dependency-policy/npm-audit-full.exit

      # Este comparativo representa somente o que o npm considera produção.
      # Ele é um gate separado porque o resultado não pode substituir o audit
      # completo: Electron e npm são devDependencies, mas são distribuídos.
      - name: Audit npm dependency graph (omit dev, required gate)
        shell: bash
        run: |
          # Até 3 tentativas SÓ quando o npm não devolveu relatório (registro fora
          # do ar: 400/503 em 19/09). Com relatório, vale a primeira resposta — o
          # gate não é afrouxado, só deixa de cair por um soluço do registro.
          for attempt in 1 2 3; do
            set +e
            npm audit --omit=dev --json > build/dependency-policy/npm-audit-production.json
            status=$?
            set -e
            if grep -q '"auditReportVersion"' build/dependency-policy/npm-audit-production.json; then break; fi
            echo "npm audit sem relatório (tentativa $attempt/3); o registro do npm pode estar indisponível."
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          printf '%s\n' "$status" > build/dependency-policy/npm-audit-production.exit

      - name: Generate npm SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > build/dependency-policy/npm-sbom.cdx.json

      - name: Build unpacked application
        timeout-minutes: 10
        run: npm run pack

      - name: Inventory packaged application
        run: npm run inventory:package -- --release-dir release --out build/dependency-policy/package-inventory.json

      - name: Verify dependency policy gates
        run: >-
          node scripts/verify-dependency-policy.cjs
          --full build/dependency-policy/npm-audit-full.json
          --full-exit build/dependency-policy/npm-audit-full.exit
          --production build/dependency-policy/npm-audit-production.json
          --production-exit build/dependency-policy/npm-audit-production.exit
          --npm-sbom build/dependency-policy/npm-sbom.cdx.json
          --inventory build/dependency-policy/package-inventory.json

      - name: Upload npm policy reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-policy-npm
          path: app/build/dependency-policy
          if-no-files-found: error

  python-dependency-audit:
    name: Python dependency audit (nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install locked launcher requirements
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      # Keep the scanner version explicit so a future pip-audit release cannot
      # change the CI contract without a reviewed diff.
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit locked requirements and generate SBOM
        shell: bash
        run: |
          mkdir -p app/build/dependency-policy
          set +e
          python -m pip_audit \
            --requirement requirements.txt \
            --strict \
            --progress-spinner off \
            --format json \
            --output app/build/dependency-policy/pip-audit.json
          audit_status=$?
          printf '%s\n' "$audit_status" > app/build/dependency-policy/pip-audit.exit
          python -m pip_audit \
            --requirement requirements.txt \
            --strict \
            --progress-spinner off \
            --format cyclonedx-json \
            --output app/build/dependency-policy/pip-sbom.cdx.json
          sbom_status=$?
          printf '%s\n' "$sbom_status" > app/build/dependency-policy/pip-sbom.exit
          set -e
          if [ "$audit_status" -ne 0 ]; then
            exit "$audit_status"
          fi
          if [ "$sbom_status" -ne 0 ]; then
            exit "$sbom_status"
          fi

      - name: Upload Python policy reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-policy-python
          path: app/build/dependency-policy/pip-*
          if-no-files-found: error

  canvas-visual-matrix:
    name: Matriz visual completa do canvas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Mesma sessão A do gate do PR (fixture, interações, matriz, vários
      # agentes), com FELIXO_SMOKE_MATRIZ=completa. Uma falha lista cada caso
      # (tema, viewport, DPR, Modo Performance) e os elementos envolvidos.
      - name: Canvas smoke com a matriz completa
        timeout-minutes: 25
        shell: bash
        env:
          FELIXO_SMOKE_SESSOES: A
          FELIXO_SMOKE_MATRIZ: completa
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:canvas-smoke
          else
            npm run test:canvas-smoke
          fi

      - name: Upload canvas visual matrix evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canvas-visual-matrix-${{ matrix.os }}
          path: |
            app/build/canvas-smoke-evidencia/**
            app/build/canvas-visual-regression/**
          if-no-files-found: ignore

  # 4. O que saiu do CI de cada push em 19/10/2026 por ser repetição cara: os
  #    benchmarks de npm-runtime, do caminho de saída do PTY e da política de
  #    scrollback (com os mesmos `--check`), e a matriz de 50 repetições do
  #    contexto inicial. Sem o gate de regressão entre commits, que dependia de
  #    um baseline por push.
  medicoes:
    name: Benchmarks e repetições (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Benchmark npm runtime
        timeout-minutes: 10
        shell: bash
        run: npm run benchmark:npm-runtime:check -- --iterations=2 --out=npm-runtime-${{ matrix.os }}.json

      - name: Benchmark PTY output path
        timeout-minutes: 5
        run: npm run benchmark:pty-output:check -- --chunks=500 --iterations=3

      - name: Benchmark terminal scrollback policy
        timeout-minutes: 10
        shell: bash
        run: |
          run_benchmark() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a npm run benchmark:terminal:check -- --out=terminal-scrollback-${{ matrix.os }}.json
            else
              npm run benchmark:terminal:check -- --out=terminal-scrollback-${{ matrix.os }}.json
            fi
          }
          # O node-pty derruba o processo de vez em quando no runner Windows
          # (exit 139 e exit 3 no encerramento). Só ESSES códigos repetem, até 3
          # vezes; qualquer outra falha do benchmark falha na hora.
          for attempt in 1 2 3; do
            set +e
            run_benchmark
            status=$?
            set -e
            if [ "$status" -ne 139 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
            echo "benchmark terminou com crash do node-pty (código $status), tentativa $attempt/3"
          done
          exit "$status"

      - name: Test Canvas initial context E2E (50 repetições)
        timeout-minutes: 15
        env:
          FELIXO_CONTEXT_MATRIX_RUNS: 50
          FELIXO_CONTEXT_MATRIX_REPORT: build/canvas-context-matrix-${{ matrix.os }}.json
        run: >-
          npm run test:canvas-context --
          --reporter=json
          --outputFile=build/canvas-context-e2e-${{ matrix.os }}.json

      - name: Upload benchmarks e relatórios
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: medicoes-${{ matrix.os }}
          path: |
            app/npm-runtime-${{ matrix.os }}.json
            app/terminal-scrollback-${{ matrix.os }}.json
            app/build/canvas-context-e2e-${{ matrix.os }}.json
            app/build/canvas-context-matrix-${{ matrix.os }}.json
          if-no-files-found: ignore

  # 5. O smoke completo do canvas (sessões A–F) fora do Linux. No PR ele roda
  #    só no Linux; o Release valida o app instalado em cada SO.
  canvas-smoke:
    name: Canvas smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test Canvas smoke
        timeout-minutes: 20
        run: npm run test:canvas-smoke

      - name: Upload canvas smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canvas-smoke-${{ matrix.os }}
          path: |
            app/build/canvas-smoke-evidencia/**
            app/build/canvas-reading-smoke/**
            app/build/canvas-visual-regression/**
          if-no-files-found: ignore
