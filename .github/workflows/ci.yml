name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Em PR, um push novo cancela a run anterior da mesma branch: sem isto, cada push
# deixava a run velha gastando runner e atrasando a fila da run que importa. Na
# `main` NUNCA cancela: o Release depende do CI de cada commit.
#
# O CI roda só o que a mudança pede (job `scope`, decisão em
# .github/scripts/ci-scope.sh). As auditorias de dependência só rodam quando o
# lockfile ou o requirements mudam, os scripts de release só quando eles mudam,
# e o smoke do canvas só quando o app muda. Na dúvida (arquivo desconhecido,
# erro de API, mudança no próprio CI) roda tudo. Em PR, Validate e Launcher
# rodam sempre: são checks exigidos pela regra da `main`, e um job de matriz
# pulado não reporta o nome que a regra espera (ver o `if` deles).
#
# Na `main`, a run de cada commit continua existindo e ficando verde (o Release
# gate e o "Verify CI passed" do Release procuram por ela), mas REAPROVEITA o CI
# do PR em vez de repetir tudo: compara a árvore Git do commit da main com a do
# head do PR que o originou e, se forem idênticas e a run `pull_request` desse
# head tiver passado, os demais jobs são pulados. Mesma árvore = mesmos arquivos,
# byte a byte; rodar de novo só repetiria a prova. Push direto na main roda o que
# o diff do push pede.
#
# Benchmarks, a matriz de 50 repetições do contexto inicial e o smoke do canvas
# no Windows e no macOS rodam uma vez por dia no workflow `Nightly`, não em
# cada push (decisão de 19/10/2026: eram repetição cara, sem achar defeito novo
# por push).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decide o que rodar. Este job NUNCA pode derrubar a run nem esconder teste:
  # `continue-on-error` no job, os scripts sempre saem 0 e cada job abaixo só é
  # pulado quando a saída diz `false` explicitamente — saída vazia (job que
  # falhou) roda tudo.
  scope:
    name: Escopo do CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      app: ${{ steps.scope.outputs.app }}
      launcher: ${{ steps.scope.outputs.launcher }}
      npm_deps: ${{ steps.scope.outputs.npm_deps }}
      python_deps: ${{ steps.scope.outputs.python_deps }}
      scripts: ${{ steps.scope.outputs.scripts }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      # Checkout mínimo: só os scripts da decisão (testados no job Release scripts).
      - name: Checkout dos scripts de decisão
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 1

      - name: Reaproveitar o CI do PR (push na main)
        id: reuse
        if: github.event_name == 'push'
        shell: bash
        run: |
          set +e
          saida="$(bash .github/scripts/ci-reuse.sh "$GITHUB_SHA")"
          reuse="$(sed -n 's/^reuse=//p' <<< "$saida")"
          source_run="$(sed -n 's/^source_run=//p' <<< "$saida")"
          pr_head="$(sed -n 's/^pr_head=//p' <<< "$saida")"
          main_tree="$(sed -n 's/^main_tree=//p' <<< "$saida")"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
          if [ "$reuse" = true ]; then
            run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$source_run"
            echo "CI reaproveitado da run $run_url (head $pr_head, árvore $main_tree)."
            {
              echo "### CI reaproveitado do PR"
              echo "Commit \`$GITHUB_SHA\` tem a mesma árvore Git (\`$main_tree\`) do head \`$pr_head\`,"
              echo "que passou no CI em [$source_run]($run_url). Os demais jobs foram pulados."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Decidir o que rodar
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
        run: |
          set +e
          if [ "$REUSE" = true ]; then
            printf 'app=false\nlauncher=false\nnpm_deps=false\npython_deps=false\nscripts=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=""
          ok=false
          if [ "$EVENT" = pull_request ] && [ -n "$PR_NUMBER" ]; then
            files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')" && ok=true
            # A API lista no máximo 3000 arquivos de um PR.
            [ "$(printf '%s\n' "$files" | grep -c .)" -ge 3000 ] && ok=false
          elif [ "$EVENT" = push ] && [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            files="$(gh api "repos/$REPO/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')" && ok=true
            # A comparação lista no máximo 300 arquivos.
            [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ] && ok=false
          fi
          if [ "$ok" != true ]; then
            echo "Não deu para listar os arquivos alterados; o CI roda tudo."
            files=""
          fi
          echo "Arquivos alterados:"
          printf '%s\n' "$files"
          saida="$(printf '%s\n' "$files" | bash .github/scripts/ci-scope.sh)"
          echo "$saida"
          printf '%s\n' "$saida" >> "$GITHUB_OUTPUT"
          {
            echo "### Escopo do CI"
            echo '```'
            echo "$saida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Só quando o package.json ou o lockfile mudam: um advisory novo sem commit
  # nosso aparece no `Nightly`, que roda os mesmos audits todo dia.
  dependency-policy:
    name: Dependency policy
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.npm_deps != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare policy reports
        shell: bash
        run: mkdir -p build/dependency-policy

      # O relatório completo inclui devDependencies porque Electron, npm e
      # parte da árvore que chega ao instalador vivem nesse grupo. O status do
      # comando é guardado: advisories ficam visíveis sem impedir a coleta dos
      # outros relatórios; o gate abaixo bloqueia críticos.
      - name: Audit npm dependency graph (complete)
        shell: bash
        run: |
          # Até 3 tentativas SÓ quando o npm não devolveu relatório (registro fora
          # do ar: 400/503 em 19/09). Com relatório, vale a primeira resposta — o
          # gate não é afrouxado, só deixa de cair por um soluço do registro.
          for attempt in 1 2 3; do
            set +e
            npm audit --json > build/dependency-policy/npm-audit-full.json
            status=$?
            set -e
            if grep -q '"auditReportVersion"' build/dependency-policy/npm-audit-full.json; then break; fi
            echo "npm audit sem relatório (tentativa $attempt/3); o registro do npm pode estar indisponível."
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          printf '%s\n' "$status" > build/dependency-policy/npm-audit-full.exit

      # Este comparativo representa somente o que o npm considera produção.
      # Ele é um gate separado porque o resultado não pode substituir o audit
      # completo: Electron e npm são devDependencies, mas são distribuídos.
      - name: Audit npm dependency graph (omit dev, required gate)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            set +e
            npm audit --omit=dev --json > build/dependency-policy/npm-audit-production.json
            status=$?
            set -e
            if grep -q '"auditReportVersion"' build/dependency-policy/npm-audit-production.json; then break; fi
            echo "npm audit sem relatório (tentativa $attempt/3); o registro do npm pode estar indisponível."
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          printf '%s\n' "$status" > build/dependency-policy/npm-audit-production.exit

      - name: Generate npm SBOM
        run: npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > build/dependency-policy/npm-sbom.cdx.json

      # O empacotamento executa o mesmo beforePack do release e torna o
      # npm-runtime observável no artefato, em vez de inventariar somente o
      # package-lock.
      - name: Build unpacked application
        timeout-minutes: 10
        run: npm run pack

      - name: Inventory packaged application
        run: npm run inventory:package -- --release-dir release --out build/dependency-policy/package-inventory.json

      - name: Verify dependency policy gates
        run: >-
          node scripts/verify-dependency-policy.cjs
          --full build/dependency-policy/npm-audit-full.json
          --full-exit build/dependency-policy/npm-audit-full.exit
          --production build/dependency-policy/npm-audit-production.json
          --production-exit build/dependency-policy/npm-audit-production.exit
          --npm-sbom build/dependency-policy/npm-sbom.cdx.json
          --inventory build/dependency-policy/package-inventory.json

      - name: Upload npm policy reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-policy-npm
          path: app/build/dependency-policy
          if-no-files-found: error

  # The launcher is what every operating system runs first, so it keeps a
  # cross-platform matrix — but only when it changes. Python 3.9 is the oldest
  # supported (start_app.py needs `from __future__ import annotations`). Each
  # job takes under a minute. The six names are required checks on `main`.
  launcher:
    name: Launcher (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: scope
    # Em PR, job de matriz não pode ser pulado: pulado, ele sai com o nome sem
    # expandir ("(${{ matrix.os }})") e o check exigido pela regra da `main`
    # nunca aparece. O escopo só pula esta matriz no push da main.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.scope.outputs.launcher != 'false') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # requirements.txt is generated from requirements.in and contains the
      # complete dependency graph plus hashes. Installing it here proves the
      # lock works on every supported operating system.
      - name: Install locked launcher requirements
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      # `-t .` sets the top-level directory to the repository root so the test
      # package can import `felixo_launcher` and its own `tests.support`.
      - name: Test launcher
        run: python -m unittest discover -s tests -t . -v

      - name: Check launcher starts without a menu
        shell: bash
        run: python start_app.py --help

  python-dependency-audit:
    name: Python dependency audit
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.python_deps != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install locked launcher requirements
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      # Keep the scanner version explicit so a future pip-audit release cannot
      # change the CI contract without a reviewed diff.
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit locked requirements and generate SBOM
        shell: bash
        run: |
          mkdir -p app/build/dependency-policy
          set +e
          python -m pip_audit \
            --requirement requirements.txt \
            --strict \
            --progress-spinner off \
            --format json \
            --output app/build/dependency-policy/pip-audit.json
          audit_status=$?
          printf '%s\n' "$audit_status" > app/build/dependency-policy/pip-audit.exit
          python -m pip_audit \
            --requirement requirements.txt \
            --strict \
            --progress-spinner off \
            --format cyclonedx-json \
            --output app/build/dependency-policy/pip-sbom.cdx.json
          sbom_status=$?
          printf '%s\n' "$sbom_status" > app/build/dependency-policy/pip-sbom.exit
          set -e
          if [ "$audit_status" -ne 0 ]; then
            exit "$audit_status"
          fi
          if [ "$sbom_status" -ne 0 ]; then
            exit "$sbom_status"
          fi

      - name: Upload Python policy reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-policy-python
          path: app/build/dependency-policy/pip-*
          if-no-files-found: error

  # Scripts que o workflow de Release e este CI usam (retry de HTTP 500
  # transitório, decisão de "latest", escopo do CI) — só bash, roda em
  # ubuntu-latest porque é onde esses jobs de fato executam.
  release-scripts:
    name: Release scripts
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.scripts != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test retry.sh
        run: bash .github/scripts/retry.test.sh

      - name: Test release-version.sh
        run: bash .github/scripts/release-version.test.sh

      - name: Test release-relevant.sh
        run: bash .github/scripts/release-relevant.test.sh

      - name: Test release-base.sh
        run: bash .github/scripts/release-base.test.sh

      - name: Test ci-reuse.sh
        run: bash .github/scripts/ci-reuse.test.sh

      - name: Test ci-scope.sh
        run: bash .github/scripts/ci-scope.test.sh

  # Cada sistema roda só o que depende dele. Lint, typecheck, build e o
  # benchmark do bundle olham o código-fonte, não o SO: uma vez, no Linux x64.
  validate:
    name: Validate (${{ matrix.os }})
    needs: scope
    # Em PR, job de matriz não pode ser pulado: pulado, ele sai com o nome sem
    # expandir ("(${{ matrix.os }})") e o check exigido pela regra da `main`
    # nunca aparece. O escopo só pula esta matriz no push da main.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.scope.outputs.app != 'false') }}
    runs-on: ${{ matrix.os }}
    # Teto do job: um passo pendurado falha claro em vez de ocupar o runner por horas.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            unit: true
            frontend: true
            checks: true
          # Caminhos com barra invertida, cmd.exe/ConPTY e o node-pty nativo. O
          # frontend roda aqui porque a entrega de contexto lida com caminhos
          # do Windows.
          - os: windows-latest
            unit: true
            frontend: true
          # Shell de login e o node-pty nativo do macOS.
          - os: macos-latest
            unit: true
          # Runner arm64 gratuito em repositório público: o AppImage arm64 é
          # publicado, e o que muda de arquitetura é o binário do node-pty.
          - os: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: app

    steps:
      # O Defender do runner examina cada arquivo criado (npm ci, bancos SQLite
      # dos testes, build). Tirar o repositório e as pastas temporárias da
      # varredura corta esse custo; se a política do runner recusar, segue sem.
      - name: Tirar o repositório e as pastas temporárias da varredura do Defender
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # O cache contém somente os tsbuildinfo do renderer. O tsc valida os
      # hashes/assinaturas das entradas antes de reutilizá-lo, portanto uma
      # mudança de código nunca transforma um resultado antigo em verde.
      - name: Restore TypeScript incremental cache
        if: matrix.checks
        uses: actions/cache@v5
        with:
          path: app/node_modules/.tmp
          key: typecheck-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/tsconfig*.json') }}
          restore-keys: |
            typecheck-${{ runner.os }}-

      - name: Test
        if: matrix.unit
        timeout-minutes: 15
        run: npm test

      # Estes testes não têm skip por SO: cada runner precisa provar seu
      # próprio launch spec (Linux direto, macOS shell de login, Windows
      # cmd.exe/ConPTY) e o binário nativo da sua arquitetura.
      - name: Test native PTY integration
        timeout-minutes: 10
        run: npm run test:native

      # O reporter padrão do Vitest registra "Test Files" e "Tests" no log.
      # Sem --passWithNoTests, uma coleta vazia falha o job em vez de ficar verde.
      # Uma passada da matriz do contexto inicial; as 50 rodam no `Nightly`.
      - name: Test frontend
        if: matrix.frontend
        timeout-minutes: 10
        env:
          FELIXO_CONTEXT_MATRIX_RUNS: 1
        run: npm run test:frontend

      - name: Lint
        if: matrix.checks
        timeout-minutes: 5
        run: npm run lint

      - name: Build renderer
        if: matrix.checks
        timeout-minutes: 10
        run: npm run build

      # A divisão do bundle só é válida se os chunks relativos continuarem
      # carregando no renderer real. O benchmark abre o dist em Electron,
      # abre o menu de ferramentas e carrega Fetch All.
      - name: Benchmark renderer bundle
        if: matrix.checks
        timeout-minutes: 10
        run: xvfb-run -a npm run benchmark:bundle:check -- --out=bundle-load-${{ matrix.os }}.json

      - name: Upload renderer bundle benchmark
        if: always() && matrix.checks
        uses: actions/upload-artifact@v6
        with:
          name: bundle-load-${{ matrix.os }}
          path: app/bundle-load-${{ matrix.os }}.json
          if-no-files-found: ignore

      - name: Check documentation exists
        if: matrix.checks
        shell: bash
        run: |
          required_docs=(
            "../docs/README.md"
            "../docs/projeto/IA.md"
            "../docs/projeto/ARQUITETURA.md"
            "../docs/projeto/ROADMAP.md"
            "../docs/projeto/POLITICA-VERSIONAMENTO.md"
            "../docs/projeto/RODAR-VIA-CODIGO-FONTE.md"
            "../docs/guias/GUIA-DESENVOLVEDOR.md"
            "../docs/guias/GUIA-USUARIO.md"
          )
          missing=0
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "::warning::Missing required doc: $doc"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "::warning::$missing required docs are missing"
          fi

      - name: Check for sensitive files
        if: matrix.checks
        shell: bash
        run: |
          sensitive_patterns=(".env" ".env.local" ".env.production")
          found=0
          for pattern in "${sensitive_patterns[@]}"; do
            if [ -f "$pattern" ]; then
              echo "::error::Sensitive file found: $pattern"
              found=$((found + 1))
            fi
          done
          if [ $found -gt 0 ]; then
            exit 1
          fi

  # Gate de interação e evidência visual: sobe a sessão isolada do `felixo
  # devtools` (Electron real, contra o Vite dev server) e confere hidratação,
  # oclusão, foco/teclado, handles, persistência e viewport mínimo. O PTY fake
  # não inicia CLI nem shell real. Job próprio, em paralelo aos testes: é o
  # passo mais longo (~5 min). Roda no Linux; Windows e macOS rodam no `Nightly`.
  # Cada sessão pode repetir até 2 vezes; a que só passa na repetição sai como
  # "instável" no resumo da run e no relatório.
  canvas-smoke:
    name: Canvas smoke (ubuntu-latest)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test Canvas PR smoke (interações + oclusão + acessibilidade)
        timeout-minutes: 15
        run: xvfb-run -a npm run test:canvas-smoke

      # Sempre: relatório (versão, commit, sistema, tentativas por sessão e o
      # comando que reproduz), capturas de cada tentativa que falhou e o log
      # limpo. Num verde com sessão instável, é a evidência do flake.
      - name: Upload Canvas PR smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canvas-smoke-evidencia-ubuntu-latest
          path: |
            app/build/canvas-smoke-evidencia/**
            app/build/canvas-reading-smoke/**
          if-no-files-found: ignore

      - name: Upload Canvas visual regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canvas-visual-regression-ubuntu-latest
          path: app/build/canvas-visual-regression/**
          if-no-files-found: warn
