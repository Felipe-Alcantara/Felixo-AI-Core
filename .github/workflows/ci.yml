name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # The launcher is what every operating system runs first, so it gets its own
  # matrix. It has no Node/npm dependency to install, which keeps this job fast
  # enough to catch cross-platform setup regressions before the heavier build.
  launcher:
    name: Launcher (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        # 3.9 is the oldest version the launcher supports; the modern syntax it
        # uses (`X | None`, `tuple[int, ...]`) only works there because of the
        # `from __future__ import annotations` at the top of start_app.py.
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # requirements.txt is generated from requirements.in and contains the
      # complete dependency graph plus hashes. Installing it here proves the
      # lock works on every supported operating system and Python version.
      - name: Install locked launcher requirements
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      # `-t .` sets the top-level directory to the repository root so the test
      # package can import `felixo_launcher` and its own `tests.support`.
      - name: Test launcher
        run: python -m unittest discover -s tests -t . -v

      - name: Check launcher starts without a menu
        shell: bash
        run: python start_app.py --help

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked launcher requirements
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      # Keep the scanner version explicit so a future pip-audit release cannot
      # change the CI contract without a reviewed diff.
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit locked requirements
        run: python -m pip_audit --requirement requirements.txt --strict --progress-spinner off

  # Scripts que o workflow de Release usa (retry de HTTP 500 transitório,
  # decisão de "latest") — só bash, roda em ubuntu-latest porque é onde os
  # jobs `prepare`/`finalize` do Release de fato executam. Testado aqui para
  # não virar código que ninguém mais roda depois de escrito.
  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test retry.sh
        run: bash .github/scripts/retry.test.sh

      - name: Test release-version.sh
        run: bash .github/scripts/release-version.test.sh

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # O npm que chega ao instalador é uma árvore própria, não o npm do
      # runner. A bancada compara a política anterior com a atual e executa
      # instalação/atualização offline usando o Electron em cada SO.
      - name: Benchmark npm runtime
        shell: bash
        run: npm run benchmark:npm-runtime:check -- --iterations=2 --out=npm-runtime-${{ matrix.os }}.json

      - name: Upload npm runtime benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-runtime-${{ matrix.os }}
          path: app/npm-runtime-${{ matrix.os }}.json
          if-no-files-found: ignore

      # O cache contém somente os tsbuildinfo do renderer. O tsc valida os
      # hashes/assinaturas das entradas antes de reutilizá-lo, portanto uma
      # mudança de código nunca transforma um resultado antigo em verde.
      - name: Restore TypeScript incremental cache
        uses: actions/cache@v4
        with:
          path: app/node_modules/.tmp
          key: typecheck-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/tsconfig*.json') }}
          restore-keys: |
            typecheck-${{ runner.os }}-

      - name: Test
        run: npm test

      # Mantém a cobertura que depende de node-pty visível no log da matriz.
      # Estes testes não têm skip por SO: cada runner precisa provar seu
      # próprio launch spec (Linux direto, macOS shell de login, Windows
      # cmd.exe/ConPTY).
      - name: Test native PTY integration
        run: npm run test:native

      # O reporter padrão do Vitest registra "Test Files" e "Tests" no log.
      # Sem --passWithNoTests, uma coleta vazia falha o job em vez de ficar verde.
      - name: Test frontend
        run: npm run test:frontend

      # O scrollback adaptativo só pode ser habilitado depois de medir a
      # combinação real Electron + xterm + PTY nos três runners. O check usa
      # 1/5/10/20 sessões, confirma identidade/attach/resume e compara 10/20
      # contra o baseline fixo de 20k. Linux precisa do display virtual; os
      # outros dois runners abrem a mesma janela Electron nativamente.
      - name: Benchmark terminal scrollback policy
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run benchmark:terminal:check -- --out=terminal-scrollback-${{ matrix.os }}.json
          else
            npm run benchmark:terminal:check -- --out=terminal-scrollback-${{ matrix.os }}.json
          fi

      - name: Upload terminal scrollback benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-scrollback-${{ matrix.os }}
          path: app/terminal-scrollback-${{ matrix.os }}.json
          if-no-files-found: ignore

      - name: Lint
        run: npm run lint

      - name: Build renderer
        run: npm run build

      # A divisão do bundle só é válida se os chunks relativos continuarem
      # carregando no renderer real. O benchmark abre o dist em Electron,
      # abre o menu de ferramentas e carrega Fetch All; Linux usa o mesmo
      # display virtual da bancada de scrollback.
      - name: Benchmark renderer bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run benchmark:bundle:check -- --out=bundle-load-${{ matrix.os }}.json
          else
            npm run benchmark:bundle:check -- --out=bundle-load-${{ matrix.os }}.json
          fi

      - name: Upload renderer bundle benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-load-${{ matrix.os }}
          path: app/bundle-load-${{ matrix.os }}.json
          if-no-files-found: ignore

      - name: Check documentation exists
        shell: bash
        run: |
          required_docs=(
            "../docs/README.md"
            "../docs/projeto/IA.md"
            "../docs/projeto/ARQUITETURA.md"
            "../docs/projeto/ROADMAP.md"
            "../docs/projeto/POLITICA-VERSIONAMENTO.md"
            "../docs/projeto/RODAR-VIA-CODIGO-FONTE.md"
            "../docs/guias/GUIA-DESENVOLVEDOR.md"
            "../docs/guias/GUIA-USUARIO.md"
          )
          missing=0
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "::warning::Missing required doc: $doc"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "::warning::$missing required docs are missing"
          fi

      - name: Check for sensitive files
        shell: bash
        run: |
          sensitive_patterns=(".env" ".env.local" ".env.production")
          found=0
          for pattern in "${sensitive_patterns[@]}"; do
            if [ -f "$pattern" ]; then
              echo "::error::Sensitive file found: $pattern"
              found=$((found + 1))
            fi
          done
          if [ $found -gt 0 ]; then
            exit 1
          fi
