name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # The launcher is what every operating system runs first, so it gets its own
  # matrix. It has no Node/npm dependency to install, which keeps this job fast
  # enough to catch cross-platform setup regressions before the heavier build.
  launcher:
    name: Launcher (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        # 3.9 is the oldest version the launcher supports; the modern syntax it
        # uses (`X | None`, `tuple[int, ...]`) only works there because of the
        # `from __future__ import annotations` at the top of start_app.py.
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # requirements.txt is generated from requirements.in and contains the
      # complete dependency graph plus hashes. Installing it here proves the
      # lock works on every supported operating system and Python version.
      - name: Install locked launcher requirements
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      # `-t .` sets the top-level directory to the repository root so the test
      # package can import `felixo_launcher` and its own `tests.support`.
      - name: Test launcher
        run: python -m unittest discover -s tests -t . -v

      - name: Check launcher starts without a menu
        shell: bash
        run: python start_app.py --help

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked launcher requirements
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt

      # Keep the scanner version explicit so a future pip-audit release cannot
      # change the CI contract without a reviewed diff.
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit locked requirements
        run: python -m pip_audit --requirement requirements.txt --strict --progress-spinner off

  # Scripts que o workflow de Release usa (retry de HTTP 500 transitório,
  # decisão de "latest") — só bash, roda em ubuntu-latest porque é onde os
  # jobs `prepare`/`finalize` do Release de fato executam. Testado aqui para
  # não virar código que ninguém mais roda depois de escrito.
  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test retry.sh
        run: bash .github/scripts/retry.test.sh

      - name: Test release-version.sh
        run: bash .github/scripts/release-version.test.sh

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Mantém a cobertura que depende de node-pty visível no log da matriz.
      # Estes testes não têm skip por SO: cada runner precisa provar seu
      # próprio launch spec (Linux direto, macOS shell de login, Windows
      # cmd.exe/ConPTY).
      - name: Test native PTY integration
        run: npm run test:native

      # O reporter padrão do Vitest registra "Test Files" e "Tests" no log.
      # Sem --passWithNoTests, uma coleta vazia falha o job em vez de ficar verde.
      - name: Test frontend
        run: npm run test:frontend

      - name: Lint
        run: npm run lint

      - name: Build renderer
        run: npm run build

      - name: Check documentation exists
        shell: bash
        run: |
          required_docs=(
            "../docs/README.md"
            "../docs/projeto/IA.md"
            "../docs/projeto/ARQUITETURA.md"
            "../docs/projeto/ROADMAP.md"
            "../docs/projeto/POLITICA-VERSIONAMENTO.md"
            "../docs/projeto/RODAR-VIA-CODIGO-FONTE.md"
            "../docs/guias/GUIA-DESENVOLVEDOR.md"
            "../docs/guias/GUIA-USUARIO.md"
          )
          missing=0
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "::warning::Missing required doc: $doc"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "::warning::$missing required docs are missing"
          fi

      - name: Check for sensitive files
        shell: bash
        run: |
          sensitive_patterns=(".env" ".env.local" ".env.production")
          found=0
          for pattern in "${sensitive_patterns[@]}"; do
            if [ -f "$pattern" ]; then
              echo "::error::Sensitive file found: $pattern"
              found=$((found + 1))
            fi
          done
          if [ $found -gt 0 ]; then
            exit 1
          fi
