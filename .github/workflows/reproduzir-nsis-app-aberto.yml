name: Reproduzir NSIS silencioso com o app aberto

# Investigação da task "Felixo AI Core/Instalador — investigar instalador NSIS
# silencioso que não avança com o app aberto e deixa processo elevado". Roda só
# na branch de investigação: os cenários instalam, abrem, matam e desinstalam o
# Felixo — o runner windows-latest é a máquina descartável.
on:
  push:
    branches:
      - investigacao/nsis-app-aberto
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduzir:
    name: Cenários NSIS (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Baixar os instaladores das duas últimas releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 2 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          if ($tags.Count -lt 2) { throw "Esperava duas releases, achei: $($tags -join ', ')" }
          foreach ($tag in $tags) {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern '*-win-x64.exe' --dir "C:\fx\instaladores\$tag"
          }
          "ULTIMA=$((Get-ChildItem "C:\fx\instaladores\$($tags[0])" -Filter *.exe | Select-Object -First 1).FullName)" >> $env:GITHUB_ENV
          "ANTERIOR=$((Get-ChildItem "C:\fx\instaladores\$($tags[1])" -Filter *.exe | Select-Object -First 1).FullName)" >> $env:GITHUB_ENV
          Get-ChildItem C:\fx\instaladores -Recurse -File | Select-Object FullName, Length

      # O "antes" já está medido com o instalador publicado: I preso na run
      # 37591182111 e L preso na run 37624204763 (180 s, app aberto, MessageBox).

      - name: Construir o instalador deste commit
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --no-audit --no-fund
          # Versão acima das publicadas: o instalador novo é uma atualização.
          npm version --no-git-tag-version 0.1.9999
          npx vite build
          # Mesma linha do passo "Build installers" do release.yml no Windows.
          # Citado: sem aspas o pwsh parte '-c.npmRebuild=false' em dois argumentos.
          npx electron-builder --win nsis --x64 --publish never '-c.npmRebuild=false'
          "CONSTRUIDO=$((Get-ChildItem release -Filter '*-win-x64.exe' | Select-Object -First 1).FullName)" >> $env:GITHUB_ENV

      # Depois: o instalador deste commit por cima da última release (cujo
      # desinstalador ainda tem a checagem por caminho curto), I e L como gate.
      - name: Depois da correção (instalador deste commit)
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File scripts/windows/reproduzir-nsis-app-aberto.ps1 -Base $env:ULTIMA -Novo $env:CONSTRUIDO -Saida "$env:RUNNER_TEMP\depois" -Cenarios 'I,L' -Verificar

      - name: Publicar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduzir-nsis-app-aberto
          path: ${{ runner.temp }}/depois/
          if-no-files-found: warn
